<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHT Knowledge Graph – Second Brain</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf3ea; --bg2: #fff8f1; --bg3: #f8eadf; --border: rgba(143,96,73,0.18); --border2: rgba(198,111,78,0.28);
  --gold: #e65f35; --gold-lt: #c66f4e; --gold-dim: #8f6049; --cream: #2e241f; --warm: #7b6a60;
  --text2: #8f6049; --font: 'Be Vietnam Pro', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--cream); font-family: var(--font); display: flex; height: 100vh; overflow: hidden; }

/* ── GRAPH PANE ── */
#graph-pane { flex: 1; height: 100%; position: relative; min-width: 0; }
#network { width: 100%; height: 100%; background: radial-gradient(circle at 35% 25%, rgba(244,183,189,.22), transparent 32%), var(--bg); }

/* ── HEADER OVERLAY ── */
.graph-header { position: absolute; top: 24px; left: 28px; z-index: 10; pointer-events: none; }
.graph-header h1 { font-size: 22px; font-weight: 800; color: var(--gold); text-shadow: none; }
.graph-header p { font-size: 12px; color: var(--text2); margin-top: 4px; letter-spacing: 0.04em; }

/* ── SIDE PANEL ── */
#sidepanel { width: 420px; flex-shrink: 0; height: 100%; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; box-shadow: -12px 0 34px rgba(91,54,35,.08); }
.panel-topbar { padding: 24px 28px 0; flex-shrink: 0; }
.panel-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
#node-title { font-size: 24px; font-weight: 800; color: var(--gold-lt); letter-spacing: -0.01em; line-height: 1.2; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.panel-body { flex: 1; overflow-y: auto; padding: 20px 28px 32px; }

/* Content Styles */
.panel-body p { font-size: 14px; color: var(--warm); line-height: 1.75; margin-bottom: 14px; }
.panel-body h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); margin: 22px 0 10px; }
.panel-body ul { padding-left: 0; margin-bottom: 14px; list-style: none; }
.panel-body ul li { font-size: 13px; color: var(--warm); line-height: 1.65; margin-bottom: 8px; padding-left: 16px; position: relative; }
.panel-body ul li::before { content: '›'; position: absolute; left: 0; color: var(--gold-dim); font-weight: 700; }
.panel-body strong { color: var(--cream); font-weight: 600; }
.quote { font-style: italic; border-left: 2px solid var(--gold); padding: 10px 16px; color: var(--text2); font-size: 13px; line-height: 1.7; margin: 16px 0; background: #ffe1e4; border-radius: 0 8px 8px 0; }

/* Tags */
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border2); color: var(--gold-lt); background: #fff; }

/* ── FOOTER CTA ── */
.panel-footer { flex-shrink: 0; padding: 16px 28px 20px; border-top: 1px solid var(--border); background: var(--bg2); }
.panel-cta-group { display: flex; gap: 10px; }
.panel-cta {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  padding: 10px 16px; border-radius: 7px; text-decoration: none; transition: all .2s; cursor: pointer; border: none;
}
.panel-cta-primary { background: var(--gold); color: #fff; }
.panel-cta-primary:hover { background: var(--gold-lt); transform: translateY(-1px); }
.panel-cta-secondary { background: transparent; color: var(--warm); border: 1px solid var(--border2); }
.panel-cta-secondary:hover { border-color: var(--gold); color: var(--gold-lt); background: rgba(255,255,255,.56); }

.loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; color: var(--gold); }

/* ── RESPONSIVE MOBILE FIX ── */
@media (max-width: 768px) {
  body {
    flex-direction: column; /* Chuyển từ dàn ngang sang dàn dọc */
  }
  
  #graph-pane {
    flex: none;
    height: 45vh; /* Đồ thị chiếm 45% chiều cao màn hình trên */
    width: 100%;
  }

  .graph-header {
    top: 15px;
    left: 15px;
  }

  .graph-header h1 {
    font-size: 18px; /* Thu nhỏ tiêu đề tránh chiếm diện tích */
  }

  .graph-header p {
    font-size: 11px;
  }

  #sidepanel {
    width: 100%; /* Panel nội dung chiếm 100% chiều rộng */
    height: 55vh; /* Panel chiếm 55% chiều cao màn hình dưới */
    border-left: none;
    border-top: 1px solid var(--border); /* Chuyển viền từ trái lên trên */
    box-shadow: 0 -10px 26px rgba(91,54,35,.08);
  }

  .panel-topbar {
    padding: 16px 20px 0;
  }

  #node-title {
    font-size: 20px;
    margin-bottom: 12px;
    padding-bottom: 12px;
  }

  .panel-body {
    padding: 12px 20px 24px;
  }

  .panel-footer {
    padding: 12px 20px 16px;
  }
}
</style>
</head>
<body>

<div id="loading" class="loading-overlay">Khởi tạo hệ thống tri thức...</div>

<div id="graph-pane">
  <div class="graph-header">
    <h1>Knowledge Graph</h1>
    <p>Hệ điều hành tri thức của Nguyễn Hoàng Tuấn</p>
  </div>
  <div id="network"></div>
</div>

<div id="sidepanel">
  <div class="panel-topbar">
    <div class="panel-eyebrow" id="panel-eyebrow">CHUYÊN GIA</div>
    <div id="node-title">Nguyễn Hoàng Tuấn</div>
  </div>
  <div class="panel-body" id="panel-body">
    <p>Hãy nhấn vào các node để khám phá chi tiết hệ sinh thái tri thức.</p>
  </div>
  <div class="panel-footer">
    <div class="panel-cta-group">
      <a href="https://zalo.me/0919073456" target="_blank" class="panel-cta panel-cta-primary">Liên hệ tư vấn</a>
      <a href="/" class="panel-cta panel-cta-secondary">Về trang chính</a>
    </div>
  </div>
</div>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQdhhVWe8oqqNCbjhcadMf_i593V8iDzjbRb-vhd9QoW_yjLU-kHq016yeQDg1-UHvkt6VbIODAndUV/pub?gid=1959904383&single=true&output=csv';

let network = null;
let nodesData = new vis.DataSet([]);
let edgesData = new vis.DataSet([]);
let contentMap = {};

function initNetwork() {
    const container = document.getElementById('network');
    network = new vis.Network(container, { nodes: nodesData, edges: edgesData }, {
        nodes: { borderWidth: 2, font: { face: 'Be Vietnam Pro', color: '#8f6049' } },
        edges: { smooth: { type: 'continuous' } },
        physics: {
            barnesHut: { gravitationalConstant: -30000, centralGravity: 0.3, springLength: 250, springConstant: 0.04 },
            stabilization: { iterations: 150 }
        }
    });
    network.on('click', p => { if (p.nodes.length) showContent(p.nodes[0]); });
}

function showContent(id) {
    const d = contentMap[id];
    if (!d) return;
    document.getElementById('panel-eyebrow').textContent = d.eyebrow || "CHI TIẾT";
    document.getElementById('node-title').textContent = d.title;
    
    let html = `<p>${d.short}</p>${d.detailed}`;
    if (d.tags && d.tags.length > 0) {
        const tagsHtml = d.tags.map(t => `<span class="tag">${t.trim()}</span>`).join('');
        html += `<div class="tag-row">${tagsHtml}</div>`;
    }
    document.getElementById('panel-body').innerHTML = html;
}

function loadData() {
    Papa.parse(SHEET_CSV_URL, {
        download: true, header: true, skipEmptyLines: 'greedy',
        transformHeader: h => h.trim(),
        complete: function(results) {
            const nodes = []; const edges = [];
            results.data.forEach(row => {
                if (!row.Node_ID) return;
                const isHub = row.Node_ID === "1";
                
                // PHÓNG TO HUB TRUNG TÂM
                nodes.push({
                    id: row.Node_ID,
                    label: (row.Title || "").split(' ').join('\n'),
                    shape: (row.Node_Type === 'Hub' || row.Node_Type === 'Main') ? 'circle' : 'dot',
                    size: parseInt(row.Node_Size) || (isHub ? 80 : 30), // TĂNG LÊN 80
                    x: isHub ? 0 : undefined, y: isHub ? 0 : undefined, fixed: isHub,
                    color: { background: isHub ? '#f8eadf' : '#fff8f1', border: '#e65f35' },
                    font: { size: isHub ? 20 : 12, bold: isHub } // TĂNG CỠ CHỮ HUB
                });
                
                if (row.Parent_ID) {
                    edges.push({ 
                        from: row.Parent_ID.trim(), 
                        to: row.Node_ID, 
                        width: 2, 
                        color: 'rgba(230,95,53,0.28)',
                        smooth: { type: 'continuous' }
                    });
                }
                
                if (row.Related_Nodes) {
                    row.Related_Nodes.split(',').forEach(rel => {
                        if (rel.trim()) {
                            edges.push({ 
                                from: row.Node_ID, 
                                to: rel.trim(), 
                                width: 1.5, 
                                dashes: true, 
                                physics: false,
                                smooth: { type: 'curvedCW', roundness: 0.2 },
                                color: 'rgba(198,111,78,0.22)' 
                            });
                        }
                    });
                }
                
                contentMap[row.Node_ID] = { title: row.Title, eyebrow: row.Eyebrow_Text, short: row.Short_Description, detailed: row.Detailed_Content, tags: row.Tags ? row.Tags.split(',') : [] };
            });
            nodesData.clear(); nodesData.add(nodes); edgesData.clear(); edgesData.add(edges);
            document.getElementById('loading').style.display = 'none';
            if (!network) initNetwork();
            if (nodes.length > 0) showContent("1");
        }
    });
}
window.onload = loadData;
</script>
</body>
</html>
